name: Native checks
on:
  push:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'tests/**'
      - 'tools/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'tests/**'
      - 'tools/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-tests.yml'
  workflow_dispatch:
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check binary parser
        run: python -m unittest discover -s tests -v
      - name: Configure native core
        run: cmake -S . -B build -DWOLF_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release -DWOLF_BUILD_PC_CONVERTER=${{ runner.os == 'Windows' && 'ON' || 'OFF' }}
      - name: Compile
        run: cmake --build build --config Release --parallel 4
      - name: Test interpreter and persistent state
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows PC save converter
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pc-save-converter
          path: |
            build/Release/wolf-pc-convert.exe
            docs/PC_SAVES.md
            third_party/wolfsave/LICENSE
          retention-days: 14
  frontend:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile SDL frontend on macOS
        run: |
          cmake -S . -B build -DWOLF_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4
      - name: Test native renderer screenshot files
        run: ctest --test-dir build -C Release --output-on-failure
