name: Native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check binary parser
        run: python -m unittest discover -s tests -v
      - name: Configure native core
        run: cmake -S . -B build -DWOLF_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel 4
      - name: Test interpreter and persistent state
        run: ctest --test-dir build -C Release --output-on-failure
  frontend:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile SDL frontend on macOS
        run: |
          cmake -S . -B build -DWOLF_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4
